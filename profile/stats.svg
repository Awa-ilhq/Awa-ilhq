<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190" role="img">
<title>GitHub Stats</title>
<style>
  text { font-family: 'Segoe UI', Ubuntu, sans-serif; }
  .title { fill: #e6e6e6; font-size: 17px; font-weight: 600; }
  .subtitle { fill: #9a9a9a; font-size: 11px; }
  .value { fill: #e6e6e6; font-size: 25px; font-weight: 700; }
  .label { fill: #9a9a9a; font-size: 12px; }
</style>
<rect width="100%" height="100%" rx="8" fill="#0d0d12" stroke="#30363d"/>
<text x="24" y="29" class="title">GitHub Stats</text>
<text x="24" y="47" class="subtitle">Public, non-fork repositories</text>
<line x1="24" y1="60" x2="471" y2="60" stroke="#30363d"/>

<text x="82.5" y="112" text-anchor="middle" class="value">20</text>
<text x="82.5" y="137" text-anchor="middle" class="label">Public repos</text>
<line x1="165" y1="83" x2="165" y2="151" stroke="#30363d"/>
<text x="247.5" y="112" text-anchor="middle" class="value">0</text>
<text x="247.5" y="137" text-anchor="middle" class="label">Stars</text>
<line x1="330" y1="83" x2="330" y2="151" stroke="#30363d"/>
<text x="412.5" y="112" text-anchor="middle" class="value">0</text>
<text x="412.5" y="137" text-anchor="middle" class="label">Forks</text>
<circle cx="24" cy="169" r="3" fill="#ff3b5c"/><text x="34" y="173" class="subtitle">Stats from 20 public repositories</text>
</svg>